name: CodeReview AI PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit to compare against
        required: true
        default: main
        type: string
      head_ref:
        description: Head branch or commit to analyze (defaults to this run's commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codereview-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-changes:
    name: Analyze changed Python files
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze changed Python files and apply quality gate
        env:
          CODE_REVIEW_BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          CODE_REVIEW_HEAD_REF: ${{ github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          CODE_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODE_REVIEW_MIN_SCORE: ${{ vars.CODE_REVIEW_MIN_SCORE || '75' }}
          CODE_REVIEW_FAIL_ON_CRITICAL: ${{ vars.CODE_REVIEW_FAIL_ON_CRITICAL || 'true' }}
          CODE_REVIEW_MAX_CRITICAL: ${{ vars.CODE_REVIEW_MAX_CRITICAL }}
          CODE_REVIEW_MAX_WARNINGS: ${{ vars.CODE_REVIEW_MAX_WARNINGS }}
        run: python cli.py --ci
